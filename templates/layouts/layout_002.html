<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attestation Letter</title>
<style>
    @page { size: A4; margin: 25mm 22mm 25mm 22mm; }
    * { box-sizing: border-box; }
    body {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 12pt;
        line-height: 1.75;
        color: #111;
        margin: 0;
        padding: 0;
    }
    .header {
        text-align: right;
        margin-bottom: 28px;
        max-width: 280px;
        margin-left: auto;
        line-height: 1.6;
        font-size: 11.5pt;
    }
    .header p { margin: 0; }
    .addressee {
        margin-bottom: 28px;
        max-width: 320px;
        line-height: 1.6;
        font-size: 11.5pt;
    }
    .addressee p { margin: 0; }
    .salutation { margin-bottom: 16px; }
    h1.title {
        text-align: center;
        font-size: 13pt;
        font-weight: bold;
        letter-spacing: 3px;
        margin: 30px 0;
        text-decoration: underline;
        text-underline-offset: 6px;
        text-decoration-thickness: 1px;
    }
    .body p {
        text-align: justify;
        margin: 0 0 14px 0;
        text-indent: 2em;
    }
    .body p:first-child { text-indent: 0; }
    .closing { text-align: right; margin-top: 40px; }
    .closing p { margin: 0; }
    .signature { text-align: right; margin-top: 60px; }
    .signature-line {
        border-top: 1px solid #333;
        width: 220px;
        margin-left: auto;
        margin-bottom: 6px;
    }
    .signature p { margin: 0; }
    .signature .role { font-size: 10pt; font-style: italic; color: #444; }
</style>
</head>
<body>

    <div class="header">
        <p>{{ parent_address_wrapped | safe }}</p>
        <p>{{ letter_date }}</p>
    </div>

    <div class="addressee">
        <p>{{ addressee_title }}</p>
        <p>{{ institution_name }}</p>
        <p>{{ campus_location | replace('\n', '<br>') | safe }}</p>
    </div>

    <div class="salutation">
        <p>Dear Sir/Ma,</p>
    </div>

    <h1 class="title">ATTESTATION LETTER</h1>

    <div class="body">
        {{ body_content | safe }}
    </div>

    <div class="closing">
        <p>Yours faithfully,</p>
    </div>

    <div class="signature">
        <div class="signature-line"></div>
        <p><strong>{{ parent_title }} {{ parent_name }}</strong></p>
        <p class="role">(Parent / Guardian)</p>
    </div>

</body>
</html>
